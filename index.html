<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixLingo</title>
    <!-- 引入 KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- 引入自定義 CSS 與 JS -->
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header class="navbar glass">
        <div class="logo">MatrixLingo</div>
        <div class="controls">
            <div class="streak" id="streak-container">
                🔥 <span id="streak-count">0</span>
            </div>
            <button class="icon-btn" id="theme-toggle">🌓</button>
        </div>
    </header>

    <main class="container">
        <!-- 左側單元列表 (Duolingo 風格路徑) -->
        <aside class="sidebar glass">
            <h2>學習路徑</h2>
            <div id="unit-path"></div>
        </aside>

        <!-- 右側遊戲區域 -->
        <section class="game-area">
            <div class="card glass" id="question-card">
                <div class="unit-badge" id="current-unit-badge">單元 1</div>
                <h2 id="question-text">載入中...</h2>
                <div class="math-display" id="math-equation"></div>
                
                <div class="options-grid" id="options-container">
                    <!-- 選項將由 JS 動態生成 -->
                </div>

                <div class="feedback" id="feedback-message"></div>
                <button class="btn primary-btn" id="submit-btn" disabled>檢查答案</button>
            </div>
        </section>
    </main>
</body>
</html>
